<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MQ Journey">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MQ Journey</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Workaround for Flutter web assertion failure:
      "!identical(kind, PointerDeviceKind.trackpad) is not true"

    Chrome on macOS sometimes dispatches `pointerdown` events with an empty
    pointerType when the user scrolls or pans with a trackpad. Flutter's web
    engine maps an empty-string pointerType to PointerDeviceKind.trackpad, but
    PointerDownEvent (used for click/tap) asserts that it is NEVER a trackpad
    (trackpad pan/zoom must use PointerPanZoomStartEvent instead).

    We intercept and suppress those spurious pointerdown events at the capture
    phase — before they reach Flutter's canvas — to prevent the assertion crash
    while preserving all normal mouse, touch, and trackpad scroll behaviour.
  -->
  <script>
    (function () {
      window.addEventListener('pointerdown', function (e) {
        if (e.pointerType === '' || e.pointerType === 'unknown') {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, { capture: true, passive: false });
    })();
  </script>
  <!-- Required JS bridge for flutter_inappwebview on web (iframe control,
       evaluateJavascript). Without it the indoor/AR panorama viewer cannot
       be driven from Dart. -->
  <script type="application/javascript" src="assets/packages/flutter_inappwebview_web/assets/web/web_support.js" defer></script>
  <meta name="theme-color" content="#C6006F">
  <style>
    /* Open Day 2026 pre-Flutter loading treatment: the page shows the brand
       wordmark on the campaign magenta until the Flutter engine paints its
       own (matching) splash — no white/blank flash at any point. */
    html, body { height: 100%; margin: 0; }
    body {
      background: linear-gradient(180deg, #C6006F 0%, #7C1850 100%);
      display: flex; align-items: center; justify-content: center;
    }
    #mq-boot {
      color: #fff; text-align: center;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #mq-boot .wordmark { font-size: 34px; font-weight: 800; letter-spacing: 0.5px; }
    #mq-boot .wordmark .paren { font-weight: 300; opacity: 0.55; }
    #mq-boot .wordmark .us { font-size: 17px; font-style: italic; opacity: 0.85; vertical-align: super; }
    #mq-boot .date { margin-top: 12px; font-size: 12px; font-weight: 700; letter-spacing: 2px; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="mq-boot">
    <div class="wordmark"><span class="paren">(</span>OPEN DAY<span class="paren">)</span><span class="us">us</span></div>
    <div class="date">15 AUGUST 2026 &nbsp;·&nbsp; 10AM – 4PM</div>
  </div>
  <script>
    // Remove the boot placeholder as soon as Flutter's first frame renders.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('mq-boot');
      if (boot) boot.remove();
      document.body.style.background = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
