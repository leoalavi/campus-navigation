name: campus_navigation
description: Campus Navigation — an independent campus wayfinding app for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  supabase_flutter: ^2.15.1
  firebase_core: ^4.2.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  intl: ^0.20.2
  timezone: ^0.11.0

  # Maps & Location
  google_maps_flutter: ^2.15.0
  flutter_map: ^8.3.0
  flutter_map_tile_caching: ^10.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # Security
  flutter_secure_storage: ^10.0.0
  # Verifies the Ed25519 signatures on printed Open Day QR codes.
  cryptography: ^2.9.0

  # Notifications
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0

  # UI
  cupertino_icons: ^1.0.8
  confetti: ^0.8.0

  # 360° indoor tours (hosts the bundled Pannellum viewer)
  flutter_inappwebview: ^6.1.5

  # Utilities
  app_links: ^7.0.0
  connectivity_plus: ^7.0.0
  http: ^1.4.0
  logger: ^2.5.0
  icalendar_parser: ^2.1.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.1
  flutter_compass: ^0.8.1
  torch_light: ^1.1.0
  meta: ^1.17.0
  # Open Day QR scanner.
  mobile_scanner: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  # Test-only: lets settings_page_test.dart fake the url_launcher platform
  # channel rather than hitting a real (nonexistent in tests) OS handler.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  # Test/tooling only: generate and sign Open Day QR fixtures.
  crypto: ^3.0.6
  qr: ^4.0.0
  riverpod: any

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/glass_refraction.frag
  assets:
    - assets/data/
    - assets/data/indoor/
    - assets/maps/
    - assets/images/
    - assets/photos/
    - assets/stamps/
    - assets/qr/open_day/2026/
    - assets/web/
    - assets/web/pannellum/

# Icon artifacts are derived from the canonical artwork (assets/images/
# app_logo.png) by tool/branding/build_icon_assets.py. The derived full-bleed
# square has no transparency, so iOS never flattens a margin onto white, and
# Android gets a true adaptive icon instead of a legacy PNG on a white plate.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon_full_bleed.png"
  adaptive_icon_background: "#F2ECE6"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  # The foreground PNG already places the artwork inside the 66dp safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#F7F3EE"
    theme_color: "#A6192E"
